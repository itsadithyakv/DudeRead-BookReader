[package]
name = "leaflet"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
oauth2 = { version = "4.4", default-features = false, features = ["reqwest", "rustls-tls"] }
quick-xml = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
urlencoding = "2.1"
zip = "0.6"
dirs = "4"
tauri-plugin-dialog = "2.5.6"
tauri-plugin-single-instance = "2.4.3"
dotenvy = "0.15"
base64 = "0.22"
regex = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.tauri]
version = "2.5.6"
features = ["protocol-asset"]

[features]
custom-protocol = ["tauri/custom-protocol"]
